<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unilingo - Learning Path</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- ✅ GLOBAL BACKGROUND CSS -->
<link rel="stylesheet" href="background.css">

<link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="assets.css">

</head>

<body>

<!-- ✅ GLOBAL BACKGROUND SYSTEM -->
<div class="background-language" id="backgroundLanguage"></div>
<div class="overlay"></div>

<div class="phone">

<div class="card">

    <div class="header">
        UNIT 1 - LEARNING PATH
    </div>

    <div class="path">

        <div class="node" data-level="1" data-page="intro.html">
            <div class="circle"><i class="fas fa-book-open"></i></div>
            <div class="info"><i class="fas fa-star"></i> Introduction</div>
        </div>

        <div class="node" data-level="2" data-page="listening.html">
            <div class="circle"><i class="fas fa-headphones"></i></div>
            <div class="info"><i class="fas fa-volume-up"></i> Listen</div>
        </div>

        <div class="node" data-level="3" data-page="write.html">
            <div class="circle"><i class="fas fa-keyboard"></i></div>
            <div class="info"><i class="fas fa-pen"></i> Write</div>
        </div>

        <div class="node" data-level="4" data-page="speak.html">
            <div class="circle"><i class="fas fa-microphone"></i></div>
            <div class="info"><i class="fas fa-microphone"></i> Speak</div>
        </div>

        <div class="node" data-level="5" data-page="quiziz.html">
            <div class="circle"><i class="fas fa-trophy"></i></div>
            <div class="info"><i class="fas fa-users"></i> Quiz</div>
        </div>

    </div>

</div>

</div>

<!-- FOOTER -->
<div class="footer">

    <i class="fas fa-home active" data-page="homepage.html"></i>
    <i class="fas fa-book" data-page="leaderboard.html"></i>
    <i class="fas fa-user" data-page="profile.html"></i>
    <i class="fas fa-gear" data-page="setting.html"></i>

</div>

<!-- ✅ GLOBAL BACKGROUND JS -->
<script src="background.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="homepage.js"></script>

</body>
</html>
