<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unilingo - Splash Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

 
    <canvas id="bgCanvas"></canvas>
    
    <canvas id="particleCanvas"></canvas>
    
    <div class="scan"></div>
  
    <div class="burst" id="burst"></div>

    <div id="stage">
        
        <div style="position:relative; display:flex; align-items:center; justify-content:center;">
            <div class="glow-ring"></div>
            <div class="logo-card">
              
                <div class="orbit">
                    <div class="pill pill-1">LEARN</div>
                    <div class="pill pill-2">SPEAK</div>
                    <div class="pill pill-3">EXPLORE</div>
                    <div class="pill pill-4">GROW</div>
                </div>
                
                <div class="orbit orbit-2">
                    <div class="pill pill-5">日本語</div>
                    <div class="pill pill-6">한국어</div>
                    <div class="pill pill-7">Hola!</div>
                    <div class="pill pill-8">你好</div>
                </div>

        
               <div class="logo-svg-wrap">
    <img src="holalogo.png" alt="Unilingo" style="width: 100%; height: 100%; object-fit: contain;">
</div>
                <div class="logo-shimmer"></div>
            </div>
        </div>

       
        <div class="brand">
            <div class="brand-text">Unilingo</div>
            <div class="brand-sub">Learn Every Language</div>
        </div>

      
        <div class="loader-wrap">
            <div class="loader-track">
                <div class="loader-fill"></div>
                <div class="loader-sheen"></div>
            </div>
            <div class="loader-dots">
                <div class="ldot"></div>
                <div class="ldot"></div>
                <div class="ldot"></div>
                <div class="ldot"></div>
            </div>
        </div>
    </div>

  
    <div id="fadeOut"></div>

   
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
