<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unilingo - Intro</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  color:white;
  position:relative;
}

/* =========================
   FLOATING LANGUAGE BG (GLOW UPGRADE)
========================= */
#backgroundLanguage{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;

  /* soft glow overlay */
  background: radial-gradient(circle at center,
    rgba(0,206,251,0.08),
    transparent 60%);
}

.word{
  position:absolute;
  color:#00cefb;
  font-weight:900;
  white-space:nowrap;

  text-shadow:
    0 0 6px #00cefb,
    0 0 15px #00cefb,
    0 0 30px #8a2be2;

  opacity:0.7;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  0%{
    transform:translateY(100vh) scale(0.8);
    opacity:0;
  }
  10%{
    opacity:1;
  }
  100%{
    transform:translateY(-10vh) scale(1.1);
    opacity:0;
  }
}

/* =========================
   CARD
========================= */
.card{
  width:90%;
  max-width:360px;
  text-align:center;
  padding:30px 20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border-radius:25px;
  border:1px solid rgba(255,255,255,0.12);

  position:relative;
  z-index:2;

  box-shadow:0 0 40px rgba(0,206,251,0.15);
}

/* LOGO GLOW */
.logo{
  font-size:28px;
  font-weight:bold;
  color:#00cefb;
  margin-bottom:10px;

  text-shadow:
    0 0 5px #00cefb,
    0 0 15px #00cefb,
    0 0 30px #8a2be2,
    0 0 50px #00cefb;
}

/* TEXT */
p{
  margin:15px 0 25px;
  color:#ccc;
  line-height:1.5;
}

/* BUTTON */
.start-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background:#00cefb;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.start-btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 25px #00cefb;
}

/* =========================
   HOME BUTTON
========================= */
.home-btn{
    position:absolute;
    top:18px;
    right:18px;

    width:42px;
    height:42px;
    border-radius:50%;

    background:rgba(255,255,255,0.1);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    text-decoration:none;

    transition:0.3s;
}

.home-btn:hover{
    background:#00cefb;
    box-shadow:0 0 20px #00cefb;
    transform:translateY(-3px);
}

/* =========================
   BACK BUTTON
========================= */
.back-btn{
    position:absolute;
    top:18px;
    left:18px;

    width:42px;
    height:42px;
    border-radius:50%;

    background:rgba(255,255,255,0.1);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    text-decoration:none;

    transition:0.3s;
}

.back-btn:hover{
    background:#8a2be2;
    box-shadow:0 0 20px #8a2be2;
    transform:translateX(-3px);
}

/* =========================
   VIDEO
========================= */
#introVideo{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);

  width:90%;
  max-width:420px;
  aspect-ratio:16/9;

  object-fit:contain;
  border-radius:20px;

  display:none;
  background:black;
  z-index:999;

  box-shadow:0 0 60px rgba(0,206,251,0.25);
}

/* FADE */
.showVideo{
  animation:fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn{
  from{opacity:0; transform:translate(-50%, -50%) scale(0.9);}
  to{opacity:1; transform:translate(-50%, -50%) scale(1);}
}

</style>
</head>

<body>

<!-- 🌍 FLOATING BACKGROUND -->
<div id="backgroundLanguage"></div>

<!-- VIDEO -->
<video id="introVideo" playsinline>
  <source src="unilingo.mp4" type="video/mp4">
</video>

<!-- SOUND -->
<audio id="introSound" src="unilingo.mp4"></audio>

<!-- CARD -->
<div class="card" id="card">

  <a href="javascript:history.back()" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
  </a>

  <a href="homepage.html" class="home-btn">
    <i class="fa-solid fa-house"></i>
  </a>

  <div class="logo">
    <i class="fa-solid fa-language"></i>
    Unilingo
  </div>

  <p>
    Learn languages in a fun way 🎮<br>
    Speak • Listen • Write • Play
  </p>

  <button class="start-btn" onclick="playIntro()">
    Start Learning
  </button>

</div>

<script>

function playIntro(){

    let video = document.getElementById("introVideo");
    let sound = document.getElementById("introSound");
    let card  = document.getElementById("card");

    card.style.display = "none";

    video.style.display = "block";
    video.classList.add("showVideo");

    sound.currentTime = 0;
    sound.play();

    video.play().catch(err => {
        console.log("Video error:", err);
    });

    video.onended = function(){
        sound.pause();
        localStorage.setItem("progress", 2);
        window.location.href = "homepage.html";
    };
}

/* FLOATING WORDS */
const words = [
  "Hello","Hola","Bonjour","مرحبا","こんにちは",
  "한국어","你好","Ciao","Namaste","Olá",
  "Привет","Selamat","Szia","Shalom"
];

const container = document.getElementById("backgroundLanguage");

function createWord(){

    const word = document.createElement("span");
    word.className = "word";

    word.innerText = words[Math.floor(Math.random() * words.length)];

    word.style.left = Math.random() * 100 + "vw";
    word.style.fontSize = (14 + Math.random() * 26) + "px";
    word.style.animationDuration = (6 + Math.random() * 10) + "s";

    container.appendChild(word);

    setTimeout(() => {
        word.remove();
    }, 12000);
}

setInterval(createWord, 220);

</script>

</body>
</html>
