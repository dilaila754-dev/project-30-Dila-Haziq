<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unilingo</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="background-language" id="backgroundLanguage"></div>

<div class="overlay"></div>

<div class="form-card">

    <a href="welcome.html" class="back-btn">
        <i class="fas fa-chevron-left"></i>
    </a>

    <div class="logo-box">
        <img src="logins.png" alt="Unilingo Logo">
    </div>

    <div class="form-header">
        <h2>Start Your Journey</h2>
        <p>Ready to continue back your streak?</p>
    </div>

    <p id="showUser" style="color:white; font-size:13px; margin-bottom:10px;"></p>

    <!-- FORM -->
    <form id="signUpForm">

        <!-- USERNAME -->
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>

        <!-- EMAIL -->
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" required>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
            <label>Password</label>

            <div class="pass-wrapper">

                <input type="password" id="password" placeholder="Minimum 8 characters" required>

                <!-- TOGGLE ICON (READY) -->
                <i class="fas fa-eye-slash" id="togglePass"></i>

            </div>

        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn-submit">
            Log In
        </button>

    </form>

</div>

<!-- JS -->
<script src="login.js"></script>

</body>
</html>
