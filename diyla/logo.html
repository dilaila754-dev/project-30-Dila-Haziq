<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unilingo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets.css">

<style>
*{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --g1:#43e97b; --g2:#38f9d7; --g3:#4facfe; --g4:#00f2fe;
  --y:#ffe066;  --o:#ff9f43; --p:#a29bfe; --pink:#fd79a8;
  --shadow-green: 0 8px 40px rgba(67,233,123,0.45);
  --shadow-blue:  0 8px 40px rgba(79,172,254,0.45);
}

html,body{ height:100%; overflow:hidden; }

/* ─── ANIMATED MESH BACKGROUND ─── */
body{
  background: #0f2027;
  position:relative;
}

#bgCanvas{ position:fixed; inset:0; z-index:0; }

/* ─── PARTICLES ─── */
#particleCanvas{ position:fixed; inset:0; z-index:1; pointer-events:none; }

/* ─── SCANLINE SUBTLE ─── */
.scan{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(0deg,
    transparent, transparent 3px,
    rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
  );
}

/* ─── STAGE ─── */
#stage{
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:0;
}

/* ─── GLOW RING BEHIND LOGO ─── */
.glow-ring{
  position:absolute;
  width:320px; height:320px;
  border-radius:50%;
  background: conic-gradient(
    from 0deg,
    rgba(67,233,123,0.0),
    rgba(67,233,123,0.6),
    rgba(79,172,254,0.6),
    rgba(253,121,168,0.5),
    rgba(255,224,102,0.5),
    rgba(67,233,123,0.0)
  );
  filter:blur(24px);
  animation: spinGlow 5s linear infinite;
  opacity:0;
  animation-fill-mode:forwards;
}
@keyframes spinGlow{
  0%  { transform:rotate(0deg)   scale(0.5); opacity:0; }
  30% { opacity:0.7; transform:rotate(108deg) scale(1); }
  100%{ transform:rotate(360deg) scale(1);   opacity:0.5; }
}

/* ─── LOGO CARD ─── */
.logo-card{
  position:relative;
  width:260px; height:260px;
  display:flex; align-items:center; justify-content:center;
  animation: cardIn 1s cubic-bezier(.17,.89,.32,1.28) 0.2s both;
}
@keyframes cardIn{
  0%  { transform:scale(0) rotate(-20deg); opacity:0; filter:blur(20px); }
  70% { transform:scale(1.08) rotate(3deg); }
  100%{ transform:scale(1) rotate(0deg); opacity:1; filter:blur(0); }
}

/* ─── THE SVG LOGO ─── */
.logo-svg-wrap{
  position:relative; z-index:3;
  width:210px; height:210px;
  animation: logoBob 3s ease-in-out 1.2s infinite;
  filter:
    drop-shadow(0 0 18px rgba(67,233,123,0.7))
    drop-shadow(0 0 40px rgba(79,172,254,0.5))
    drop-shadow(0 12px 32px rgba(0,0,0,0.4));
}
@keyframes logoBob{
  0%,100%{ transform:translateY(0) rotate(0deg) scale(1); }
  30%    { transform:translateY(-12px) rotate(1.5deg) scale(1.02); }
  60%    { transform:translateY(-6px) rotate(-1deg) scale(1.01); }
}

/* Shimmer overlay on logo */
.logo-shimmer{
  position:absolute; inset:0; z-index:4; border-radius:50%;
  background:linear-gradient(135deg,
    transparent 30%,
    rgba(255,255,255,0.18) 50%,
    transparent 70%
  );
  background-size:200% 200%;
  animation: shimmerMove 3s ease-in-out 1.2s infinite;
  pointer-events:none;
}
@keyframes shimmerMove{
  0%,100%{ background-position:0% 0%; }
  50%    { background-position:100% 100%; }
}

/* ─── ORBITING PILLS ─── */
.orbit{
  position:absolute; inset:-50px;
  border-radius:50%;
  animation:orbitSpin 8s linear 1.2s infinite;
}
.orbit-2{ animation-duration:12s; animation-direction:reverse; inset:-80px; }

@keyframes orbitSpin{ to{ transform:rotate(360deg); } }

.pill{
  position:absolute;
  background:white;
  border-radius:20px;
  padding:5px 10px;
  font-family:'Nunito',sans-serif;
  font-weight:900;
  font-size:12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
  animation:counterOrbit 8s linear 1.2s infinite;
  white-space:nowrap;
  letter-spacing:.03em;
}
.orbit-2 .pill{ animation-duration:12s; animation-direction:reverse; }

@keyframes counterOrbit{ to{ transform:rotate(-360deg); } }

.pill-1{ top:-18px; left:50%; transform:translateX(-50%);
  color:#2ecc71; background:linear-gradient(135deg,#fff,#f0fff4); border:2px solid #2ecc71; }
.pill-2{ right:-18px; top:50%; transform:translateY(-50%);
  color:#0984e3; background:linear-gradient(135deg,#fff,#f0f8ff); border:2px solid #0984e3; }
.pill-3{ bottom:-18px; left:50%; transform:translateX(-50%);
  color:#e17055; background:linear-gradient(135deg,#fff,#fff5f0); border:2px solid #e17055; }
.pill-4{ left:-18px; top:50%; transform:translateY(-50%);
  color:#a29bfe; background:linear-gradient(135deg,#fff,#f8f0ff); border:2px solid #a29bfe; }

/* orbit-2 pills */
.pill-5{ top:-14px; left:50%; transform:translateX(-50%);
  color:#fd79a8; background:linear-gradient(135deg,#fff,#fff0f6); border:2px solid #fd79a8; }
.pill-6{ right:-14px; top:50%; transform:translateY(-50%);
  color:#00b894; background:linear-gradient(135deg,#fff,#f0fffc); border:2px solid #00b894; }
.pill-7{ bottom:-14px; left:50%; transform:translateX(-50%);
  color:#fdcb6e; background:linear-gradient(135deg,#fff,#fffbf0); border:2px solid #fdcb6e; }
.pill-8{ left:-14px; top:50%; transform:translateY(-50%);
  color:#636e72; background:linear-gradient(135deg,#fff,#f8f8f8); border:2px solid #dfe6e9; }

/* ─── BRAND NAME TEXT ─── */
.brand{
  margin-top:28px;
  position:relative; z-index:5;
  animation: brandReveal 0.8s cubic-bezier(.17,.89,.32,1.28) 0.9s both;
}
@keyframes brandReveal{
  from{ transform:translateY(24px) scale(0.8); opacity:0; }
  to  { transform:translateY(0) scale(1); opacity:1; }
}

.brand-text{
  font-family:'Baloo 2', cursive;
  font-weight:900;
  font-size:clamp(38px,10vw,56px);
  line-height:1;
  background:linear-gradient(135deg,
    #43e97b 0%, #38f9d7 25%,
    #4facfe 50%, #a29bfe 75%, #fd79a8 100%
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  background-size:200% auto;
  animation: textShimmer 4s linear 1.5s infinite;
  letter-spacing:-.01em;
  filter:drop-shadow(0 2px 12px rgba(67,233,123,0.4));
}
@keyframes textShimmer{
  0%  { background-position:0% center; }
  100%{ background-position:200% center; }
}

.brand-sub{
  font-family:'Nunito', sans-serif;
  font-weight:800;
  font-size:clamp(10px,2.5vw,13px);
  letter-spacing:.25em;
  text-align:center;
  color:rgba(255,255,255,0.55);
  text-transform:uppercase;
  margin-top:4px;
}

/* ─── LOADING BAR ─── */
.loader-wrap{
  margin-top:28px;
  z-index:5;
  animation: fadeUp .6s ease 1.2s both;
  width:220px;
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(12px); }
  to  { opacity:1; transform:translateY(0); }
}

.loader-track{
  width:100%; height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:99px; overflow:hidden;
  position:relative;
}
.loader-fill{
  height:100%;
  background:linear-gradient(90deg, #43e97b, #38f9d7, #4facfe, #a29bfe, #fd79a8);
  background-size:200% auto;
  border-radius:99px;
  width:0%;
  animation:
    fillUp 4.5s cubic-bezier(.4,0,.6,1) 0.8s forwards,
    bgSlide 2s linear 0.8s infinite;
  box-shadow:0 0 12px rgba(67,233,123,0.6), 0 0 24px rgba(79,172,254,0.4);
}
@keyframes fillUp{
  0%  { width:0%; }   25%{ width:35%; }
  55% { width:65%; }  80%{ width:88%; }
  100%{ width:100%; }
}
@keyframes bgSlide{
  0%  { background-position:0% center; }
  100%{ background-position:200% center; }
}

/* sheen sweep */
.loader-sheen{
  position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
  animation:sheen 1.5s ease-in-out 1.2s infinite;
}
@keyframes sheen{
  0%  { transform:translateX(-100%); }
  100%{ transform:translateX(300%); }
}

.loader-dots{
  display:flex; justify-content:center; gap:8px; margin-top:12px;
}
.ldot{
  width:8px; height:8px; border-radius:50%;
  animation:ldotBounce .8s ease-in-out infinite;
}
.ldot:nth-child(1){ background:#43e97b; animation-delay:0s; }
.ldot:nth-child(2){ background:#4facfe; animation-delay:.13s; }
.ldot:nth-child(3){ background:#fd79a8; animation-delay:.26s; }
.ldot:nth-child(4){ background:#ffe066; animation-delay:.39s; }
@keyframes ldotBounce{
  0%,100%{ transform:translateY(0) scale(1); opacity:.7; }
  50%    { transform:translateY(-8px) scale(1.2); opacity:1; }
}

/* ─── BURST PARTICLES (CSS) ─── */
.burst{ position:fixed; inset:0; z-index:4; pointer-events:none; }
.bp{
  position:absolute;
  border-radius:50%;
  animation:burstOut ease-out both;
  opacity:0;
}
@keyframes burstOut{
  0%  { transform:scale(0) translate(0,0); opacity:1; }
  100%{ transform:scale(1) translate(var(--bx),var(--by)); opacity:0; }
}

/* ─── FADE OUT ─── */
#fadeOut{
  position:fixed; inset:0; z-index:200;
  background:white; opacity:0; pointer-events:none;
  transition:opacity .8s cubic-bezier(.4,0,.2,1);
}
#fadeOut.go{ opacity:1; pointer-events:all; }
</style>
</head>

<script>

/* ══════════════════════════════════════════
   🎵 WEB AUDIO — MAGICAL JINGLE
══════════════════════════════════════════ */
function playIntroSound(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();

  function note(freq,start,dur,type='sine',gainVal=0.22,fadeOut=true){
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type;
    osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
    gain.gain.setValueAtTime(0,ctx.currentTime+start);
    gain.gain.linearRampToValueAtTime(gainVal,ctx.currentTime+start+0.04);
    if(fadeOut) gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
    osc.start(ctx.currentTime+start);
    osc.stop(ctx.currentTime+start+dur+0.05);
  }

  // ✨ Xylophone-style magical ascending melody
  const melody = [
    // freq,  start,  dur,  type,     vol
    [523.25, 0.00,  0.25, 'sine',   0.18],  // C5
    [659.25, 0.18,  0.25, 'sine',   0.20],  // E5
    [783.99, 0.34,  0.25, 'sine',   0.20],  // G5
    [1046.5, 0.50,  0.30, 'sine',   0.18],  // C6
    [1318.5, 0.65,  0.20, 'sine',   0.14],  // E6

    // sparkle tinkle overlay
    [2093,   0.10,  0.15, 'sine',   0.06],
    [2637,   0.28,  0.12, 'sine',   0.05],
    [2093,   0.46,  0.12, 'sine',   0.05],
    [3136,   0.60,  0.10, 'sine',   0.04],

    // warm chord pad underneath
    [261.63, 0.40,  0.9,  'triangle',0.08],
    [329.63, 0.40,  0.9,  'triangle',0.07],
    [392.00, 0.40,  0.9,  'triangle',0.07],

    // final chime hits
    [1568,   0.82,  0.35, 'sine',   0.16],
    [1976,   0.96,  0.35, 'sine',   0.14],
    [2349,   1.08,  0.45, 'sine',   0.18],
    [3136,   1.20,  0.5,  'sine',   0.12],

    // bloom
    [4186,   1.30,  0.6,  'sine',   0.08],
  ];

  melody.forEach(([f,s,d,t,v]) => note(f,s,d,t,v));

  // 🥁 Soft rhythmic "pop" drums
  function popDrum(start){
    const b=ctx.createOscillator(), bg=ctx.createGain();
    b.connect(bg); bg.connect(ctx.destination);
    b.type='sine';
    b.frequency.setValueAtTime(200,ctx.currentTime+start);
    b.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+start+0.12);
    bg.gain.setValueAtTime(0.18,ctx.currentTime+start);
    bg.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+0.15);
    b.start(ctx.currentTime+start);
    b.stop(ctx.currentTime+start+0.2);
  }
  [0.0,0.35,0.70,1.05].forEach(t=>popDrum(t));

  // 🎵 Success chord at end
  setTimeout(()=>{
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
      note(f, i*0.06, 1.2, 'sine', 0.12);
    });
  }, 1300);
}

/* ── Try to autoplay, fallback on first interaction ── */
let soundPlayed=false;
function trySound(){
  if(soundPlayed) return;
  soundPlayed=true;
  playIntroSound();
}
setTimeout(()=>{ try{ trySound(); }catch(e){} }, 300);
['click','touchstart','keydown'].forEach(e=>
  document.addEventListener(e, trySound, {once:true})
);

/* ══════════════════════════════════════════
   🌌 ANIMATED GRADIENT BG CANVAS
══════════════════════════════════════════ */
(function(){
  const c=document.getElementById('bgCanvas');
  const ctx=c.getContext('2d');
  let W,H,t=0;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize',resize);

  const colors=[
    [15,32,50],[10,40,80],[20,20,60],[5,35,45]
  ];
  let ci=0;

  function lerp(a,b,t){ return a+(b-a)*t; }

  function draw(){
    t+=0.005;
    const phase=(Math.sin(t)*0.5+0.5);
    const c1=colors[Math.floor(ci)%colors.length];
    const c2=colors[(Math.floor(ci)+1)%colors.length];

    const r=lerp(c1[0],c2[0],phase);
    const g=lerp(c1[1],c2[1],phase);
    const b=lerp(c1[2],c2[2],phase);

    if(phase>0.99) ci=(ci+1)%colors.length;

    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(0,0,W,H);

    // nebula blobs
    const blobs=[
      {x:W*0.2,y:H*0.3,r:W*0.4,col:`rgba(67,233,123,${0.04+0.03*Math.sin(t*1.3)})`},
      {x:W*0.8,y:H*0.7,r:W*0.35,col:`rgba(79,172,254,${0.04+0.03*Math.sin(t*0.9)})`},
      {x:W*0.5,y:H*0.15,r:W*0.3,col:`rgba(253,121,168,${0.03+0.02*Math.sin(t*1.7)})`},
      {x:W*0.1,y:H*0.8,r:W*0.25,col:`rgba(162,155,254,${0.03+0.02*Math.sin(t*1.1)})`},
    ];
    blobs.forEach(blob=>{
      const grad=ctx.createRadialGradient(blob.x,blob.y,0,blob.x,blob.y,blob.r);
      grad.addColorStop(0,blob.col);
      grad.addColorStop(1,'transparent');
      ctx.fillStyle=grad;
      ctx.fillRect(0,0,W,H);
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

(function(){
  const c=document.getElementById('particleCanvas');
  const ctx=c.getContext('2d');
  let W,H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize',resize);

  const colors=['#43e97b','#38f9d7','#4facfe','#a29bfe','#fd79a8','#ffe066','#ffffff'];
  const pts=[];
  for(let i=0;i<90;i++){
    pts.push({
      x:Math.random()*2000,y:Math.random()*1200,
      vx:(Math.random()-.5)*0.4, vy:-0.3-Math.random()*0.6,
      r:1+Math.random()*2.5,
      col:colors[Math.floor(Math.random()*colors.length)],
      a:Math.random(), da:0.005+Math.random()*0.015,
      life:Math.random()
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life+=0.003;
      p.a=Math.abs(Math.sin(p.life*Math.PI));
      if(p.y<-10){ p.y=H+10; p.x=Math.random()*W; p.life=0; }
      ctx.beginPath();
      ctx.arc(p.x%W,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col;
      ctx.globalAlpha=p.a*0.7;
      ctx.fill();
      // glow
      ctx.beginPath();
      ctx.arc(p.x%W,p.y,p.r*2.5,0,Math.PI*2);
      ctx.fillStyle=p.col;
      ctx.globalAlpha=p.a*0.12;
      ctx.fill();
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();


(function(){
  const burst=document.getElementById('burst');
  const colors=['#43e97b','#4facfe','#fd79a8','#ffe066','#a29bfe','#38f9d7','#ff9f43'];
  const cx=innerWidth/2, cy=innerHeight/2;

  setTimeout(()=>{
    for(let i=0;i<60;i++){
      const d=document.createElement('div');
      d.classList.add('bp');
      const angle=Math.random()*Math.PI*2;
      const dist=80+Math.random()*200;
      const sz=4+Math.random()*10;
      const dur=0.6+Math.random()*0.8;
      d.style.cssText=`
        left:${cx}px; top:${cy}px;
        width:${sz}px; height:${sz}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        --bx:${Math.cos(angle)*dist}px;
        --by:${Math.sin(angle)*dist}px;
        animation-name:burstOut;
        animation-duration:${dur}s;
        animation-delay:${0.2+Math.random()*0.3}s;
        box-shadow:0 0 6px currentColor;
      `;
      burst.appendChild(d);
    }
    // cleanup
    setTimeout(()=>burst.innerHTML='', 2000);
  }, 800);
})();
