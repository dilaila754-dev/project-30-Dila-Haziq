<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Unilingo </title>

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="signup.css">


</head>

<body>

<!-- FLOATING WORDS -->
<div class="background-language"
id="backgroundLanguage"></div>

<!-- OVERLAY -->
<div class="overlay"></div>

<!-- MAIN CARD -->
<div class="form-card">

<!-- BACK BUTTON -->
<a href="welcome.html"
class="back-btn">

<i class="fas fa-chevron-left"></i>

</a>

<!-- LOGO -->
<div class="logo-box">

<img src="signup.png"
alt="Unilingo Logo">

</div>

<!-- HEADER -->
<div class="form-header">

<h2>Start Your Journey</h2>

<p>
Ready to continue back your streak?
</p>

</div>

<!-- FORM -->
<form id="signUpForm">

<!-- 🔥 USERNAME (NEW ADD) -->
<div class="input-group">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Enter your name"
required>

</div>

<!-- EMAIL -->
<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="name@example.com"
required>

</div>

<!-- PASSWORD -->
<div class="input-group">

<label>Password</label>

<div class="pass-wrapper">

<input
type="password"
id="password"
placeholder="Minimum 8 characters"
required>

<i class="fas fa-eye-slash"
id="togglePass"></i>

</div>

</div>

<!-- BUTTON -->
<button
type="submit"
class="btn-submit">

Create Account

</button>

</form>
</div>

<!-- JS -->
<script src="signup.js"></script>

</body>
</html>
