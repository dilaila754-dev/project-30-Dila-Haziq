<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unilingo - Speaking</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="speak.css">
<link rel="stylesheet" href="assets.css">
<link rel="stylesheet" href="background.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="background-language" id="backgroundLanguage"></div>
<div class="overlay"></div>

<div class="card">

    <button class="back-btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="xp">⭐ XP: <span id="xp">0</span></div>

    <h3>Speaking Practice</h3>

    <div class="word-box">
        <img id="img">
        <h2 id="word"></h2>
    </div>

    <button class="listen" onclick="speak()">🔊 Listen</button>
    <button class="mic" onclick="startSpeak()">🎤</button>

    <div id="result"></div>

</div>

<div class="navbar">
    <i class="fas fa-home" onclick="go('homepage.html')"></i>
    <i class="fas fa-trophy" onclick="go('leaderboard.html')"></i>
    <i class="fas fa-user" onclick="go('profile.html')"></i>
    <i class="fas fa-gear" onclick="go('setting.html')"></i>
</div>

<script src="background.js"></script>
<script src="speak.js"></script>

</body>
</html>
